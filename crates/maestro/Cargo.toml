[package]
name = "maestro"
version = "3.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
maestro-agent = { version = "3.0.0", path = "../maestro-agent" }
maestro-control = { version = "3.0.0", path = "../maestro-control" }
maestro-core = { version = "3.0.0", path = "../maestro-core" }
maestro-proto = { version = "3.0.0", path = "../maestro-proto" }
maestro-runtime = { version = "3.0.0", path = "../maestro-runtime" }
maestro-store = { version = "3.0.0", path = "../maestro-store" }
maestro-telemetry = { version = "3.0.0", path = "../maestro-telemetry" }
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
