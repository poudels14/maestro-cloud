syntax = "proto3";

package maestro.v1;

// Payloads are JSON-encoded Rust types shared through maestro-core and maestro-store,
// so the protobuf schema stays a thin transport envelope.
message Envelope {
  bytes json = 1;
}

message ImageRequest {
  string image = 1;
}

message Chunk {
  bytes data = 1;
}

// One exec protocol frame: a type byte followed by its payload.
message ExecFrame {
  bytes data = 1;
}

message UploadChunk {
  bytes metadata = 1;
  bytes data = 2;
}

service Raft {
  rpc AppendEntries(Envelope) returns (Envelope);
  rpc Vote(Envelope) returns (Envelope);
  rpc InstallSnapshot(Envelope) returns (Envelope);
}

service Cluster {
  rpc Discover(Envelope) returns (Envelope);
  rpc Join(Envelope) returns (Envelope);
  rpc Attach(stream Envelope) returns (stream Envelope);
}

service Node {
  rpc Call(Envelope) returns (Envelope);
  rpc Exec(stream ExecFrame) returns (stream ExecFrame);
  rpc FetchImage(ImageRequest) returns (stream Chunk);
  rpc Upload(stream UploadChunk) returns (Envelope);
}
