[package]
name = "logstore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
duckdb = { workspace = true, features = ["bundled", "json", "parquet"] }
kernel-api = { path = "../../kernel/api" }
logql = { version = "0.1.0", path = "../logql" }
logs = { version = "0.1.0", path = "../logs" }
metrics = { version = "0.1.0", path = "../metrics" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
logs = { version = "0.1.0", path = "../logs", features = ["test-util"] }
metrics = { version = "0.1.0", path = "../metrics", features = ["test-util"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
