[package]
name = "logstore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
duckdb = { version = "=1.4.1", features = ["bundled", "parquet"] }
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
logql = { version = "0.1.0", path = "../logql" }
logs = { version = "0.1.0", path = "../logs" }
metrics = { version = "0.1.0", path = "../metrics" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "=1.52.3", features = ["rt", "sync"] }

[dev-dependencies]
logs = { path = "../logs", features = ["test-util"] }
metrics = { path = "../metrics", features = ["test-util"] }
runtime = { path = "../../runtime", default-features = false }
tempfile = "=3.27.0"
tokio.workspace = true

[lints]
workspace = true
