[package]
name = "dns"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
kernel-api = { version = "0.5.0", path = "../../kernel/api" }
kernel-controller = { version = "0.5.0", path = "../../kernel/controller" }
kernel-store = { version = "0.5.0", path = "../../kernel/store" }
serde = "=1.0.228"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.18"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "=1.48.0", features = ["json"] }
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
