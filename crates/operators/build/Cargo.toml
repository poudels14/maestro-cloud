[package]
name = "build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
gix-url.workspace = true
hex.workspace = true
kernel-api = { path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
logs = { version = "0.1.0", path = "../../observability/logs" }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = [
  "build-context"
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
uuid.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
logs = { version = "0.1.0", path = "../../observability/logs", features = ["test-util"] }
tar.workspace = true
tokio = { workspace = true, features = ["sync"] }
