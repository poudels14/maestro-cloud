[package]
name = "build"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64 = "=0.22.1"
flate2.workspace = true
hex = "=0.4.3"
kernel-api = { version = "0.5.0", path = "../../kernel/api" }
kernel-controller = { version = "0.5.0", path = "../../kernel/controller" }
kernel-store = { version = "0.5.0", path = "../../kernel/store" }
runtime = { version = "0.5.0", path = "../../runtime", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tar.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
