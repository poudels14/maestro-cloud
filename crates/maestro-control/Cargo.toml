[package]
name = "maestro-control"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
maestro-core = { version = "0.1.0", path = "../maestro-core" }
maestro-store = { version = "0.1.0", path = "../maestro-store" }
nanoid = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
