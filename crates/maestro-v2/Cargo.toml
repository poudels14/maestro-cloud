[package]
name = "maestro-v2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
maestro-agent = { version = "0.1.0", path = "../maestro-agent" }
maestro-control = { version = "0.1.0", path = "../maestro-control" }
maestro-core = { version = "0.1.0", path = "../maestro-core" }
maestro-runtime = { version = "0.1.0", path = "../maestro-runtime" }
maestro-store = { version = "0.1.0", path = "../maestro-store" }
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
