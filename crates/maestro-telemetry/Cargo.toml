[package]
name = "maestro-telemetry"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "sync", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
