[package]
name = "maestro-telemetry"
version = "3.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
duckdb = { version = "=1.4.1", features = ["bundled", "json", "parquet"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
strip-ansi-escapes = "0.2.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "sync", "rt", "macros", "time", "net", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
