[package]
name = "maestro-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
maestro-core = { version = "0.1.0", path = "../maestro-core" }
maestro-runtime = { version = "0.1.0", path = "../maestro-runtime" }
maestro-store = { version = "0.1.0", path = "../maestro-store" }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["sync", "time", "net", "io-util", "rt", "macros", "process"] }
tracing = "0.1.44"

[dev-dependencies]
maestro-runtime = { path = "../maestro-runtime", features = ["fake"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util", "rt-multi-thread"] }
