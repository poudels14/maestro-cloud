[package]
name = "kernel-controller"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
kernel-api = { version = "0.5.0", path = "../api" }
kernel-store = { version = "0.5.0", path = "../store" }
serde.workspace = true
serde_json = "=1.0.151"
test-util = { version = "=0.4.5", package = "tokio-test", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
test-util = ["dep:test-util"]
