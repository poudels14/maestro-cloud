[package]
name = "node-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
serde = "=1.0.228"
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt", "sync", "time"] }
x25519-dalek = { version = "=3.0.0", features = ["getrandom", "static_secrets"] }

[lints]
workspace = true

[dev-dependencies]
runtime = { path = "../../runtime", default-features = false, features = ["test-util"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "=0.3.33"
netlink-packet-route = "=0.30.0"
rtnetlink = "=0.21.0"
wireguard-control = "=2.0.0"
