[package]
name = "node-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
getrandom = "=0.4.3"
hickory-server = { version = "=0.26.1", default-features = false }
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
node-fabric = { version = "0.1.0", path = "../fabric" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
semver.workspace = true
serde = "=1.0.228"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = "=0.14.6"
x25519-dalek = { version = "=3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = { version = "=1.9.0", features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
insta = { version = "=1.48.0", features = ["json"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = ["test-util"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "=0.3.33"
netlink-packet-route = "=0.30.0"
rtnetlink = "=0.21.0"
wireguard-control = "=2.0.0"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
