[package]
name = "node-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hickory-server = { workspace = true, default-features = false }
kernel-api = { path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
ipnet.workspace = true
node-fabric = { version = "0.1.0", path = "../fabric" }
procfs-core.workspace = true
reqwest = { workspace = true, default-features = false, features = ["rustls-tls"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "sync",
  "time"
] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-socks.workspace = true
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tracing.workspace = true
x25519-dalek = { workspace = true, features = ["getrandom", "static_secrets"] }
zeroize = { workspace = true, features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = [
  "test-util"
] }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util.workspace = true
netlink-packet-route.workspace = true
rtnetlink.workspace = true
wireguard-control.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["fs", "user"] }
