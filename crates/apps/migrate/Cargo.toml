[package]
name = "migrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
clap.workspace = true
cluster = { version = "0.1.0", path = "../../cluster" }
duckdb = { workspace = true, features = ["bundled", "json", "parquet"] }
etcd-client.workspace = true
hex.workspace = true
http.workspace = true
ipnet.workspace = true
kernel-api = { path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
libc.workspace = true
logs = { version = "0.1.0", path = "../../observability/logs" }
logstore = { version = "0.1.0", path = "../../observability/logstore" }
metrics = { version = "0.1.0", path = "../../observability/metrics" }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
node-agent = { version = "0.1.0", path = "../../node/agent" }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = [
  "test-util"
] }
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "maestro-migrate"
path = "src/main.rs"

[lints]
workspace = true
