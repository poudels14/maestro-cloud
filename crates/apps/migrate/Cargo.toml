[package]
name = "migrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
base64 = "=0.22.1"
clap.workspace = true
duckdb = { version = "=1.4.1", features = ["bundled", "json", "parquet"] }
etcd-client.workspace = true
hex.workspace = true
http.workspace = true
ipnet.workspace = true
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
libc.workspace = true
logs = { version = "0.1.0", path = "../../observability/logs" }
logstore = { version = "0.1.0", path = "../../observability/logstore" }
metrics = { version = "0.1.0", path = "../../observability/metrics" }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt", "sync"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
cluster = { version = "0.1.0", path = "../../cluster" }
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[[bin]]
name = "maestro-migrate"
path = "src/main.rs"

[lints]
workspace = true
