[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
build = { version = "0.1.0", path = "../../operators/build" }
firewall = { version = "0.1.0", path = "../../operators/firewall" }
futures-util.workspace = true
ingress = { version = "0.1.0", path = "../../operators/ingress" }
ipnet.workspace = true
jsonwebtoken.workspace = true
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
logs = { version = "0.1.0", path = "../../observability/logs" }
metrics = { version = "0.1.0", path = "../../observability/metrics" }
node-agent = { version = "0.1.0", path = "../../node/agent" }
reqwest.workspace = true
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "=1.52.3", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "=0.5.3", features = ["util"] }
webhook = { version = "0.1.0", path = "../../operators/webhook" }

[dev-dependencies]
http-body-util = "=0.1.4"
logs = { version = "0.1.0", path = "../../observability/logs", features = ["test-util"] }
metrics = { version = "0.1.0", path = "../../observability/metrics", features = ["test-util"] }
rcgen = { version = "=0.14.8", features = ["pem"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = ["test-util"] }
tempfile = "=3.27.0"

[lints]
workspace = true
