[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = "=0.8.9"
axum-server = { version = "=0.8.0", features = ["tls-rustls-no-provider"] }
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "=1.52.3", features = ["net", "rt", "sync"] }

[dev-dependencies]
http-body-util = "=0.1.4"
rcgen = { version = "=0.14.8", features = ["pem"] }
reqwest.workspace = true
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
