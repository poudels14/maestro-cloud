[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-server = { workspace = true, features = ["tls-rustls-no-provider"] }
build = { version = "0.1.0", path = "../../operators/build" }
cluster = { version = "0.1.0", path = "../../cluster" }
firewall = { version = "0.1.0", path = "../../operators/firewall" }
futures-util.workspace = true
ingress = { version = "0.1.0", path = "../../operators/ingress" }
ipnet.workspace = true
jsonwebtoken.workspace = true
kernel-api = { path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
logs = { version = "0.1.0", path = "../../observability/logs" }
metrics = { version = "0.1.0", path = "../../observability/metrics" }
node-agent = { version = "0.1.0", path = "../../node/agent" }
reqwest.workspace = true
runtime = { version = "0.1.0", path = "../../runtime", default-features = false }
rustls = { workspace = true, default-features = false, features = ["ring", "std"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs"] }
webhook = { version = "0.1.0", path = "../../operators/webhook" }

[dev-dependencies]
http-body-util.workspace = true
logs = { version = "0.1.0", path = "../../observability/logs", features = ["test-util"] }
metrics = { version = "0.1.0", path = "../../observability/metrics", features = ["test-util"] }
rcgen = { workspace = true, features = ["pem"] }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
