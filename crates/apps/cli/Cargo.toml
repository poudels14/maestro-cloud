[package]
name = "maestro-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "maestro-next"
path = "src/main.rs"

[dependencies]
aws-config.workspace = true
aws-sdk-secretsmanager.workspace = true
clap.workspace = true
cluster = { version = "0.1.0", path = "../../cluster" }
crossterm = "=0.29.0"
futures-util.workspace = true
flate2.workspace = true
ignore.workspace = true
jsonwebtoken.workspace = true
json5.workspace = true
ipnet.workspace = true
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
libc.workspace = true
logs = { version = "0.1.0", path = "../../observability/logs" }
reqwest = { workspace = true, features = ["json"] }
rpassword = "=7.5.4"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
semver.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
serde_json.workspace = true
sha2.workspace = true
shellexpand.workspace = true
tempfile = "=3.27.0"
thiserror.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid.workspace = true
webpki-roots = "=0.26.11"

[lints]
workspace = true
