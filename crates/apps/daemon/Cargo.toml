[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "=0.1.89"
clap.workspace = true
cluster = { version = "0.1.0", path = "../../cluster" }
deployment = { version = "0.1.0", path = "../../operators/deployment" }
dns = { version = "0.1.0", path = "../../operators/dns" }
firewall = { version = "0.1.0", path = "../../operators/firewall" }
ingress = { version = "0.1.0", path = "../../operators/ingress" }
kernel-api = { version = "0.1.0", path = "../../kernel/api" }
kernel-controller = { version = "0.1.0", path = "../../kernel/controller" }
kernel-store = { version = "0.1.0", path = "../../kernel/store" }
logs = { version = "0.1.0", path = "../../observability/logs" }
logstore = { version = "0.1.0", path = "../../observability/logstore" }
metrics = { version = "0.1.0", path = "../../observability/metrics" }
node-agent = { version = "0.1.0", path = "../../node/agent" }
runtime = { version = "0.1.0", path = "../../runtime", default-features = false, features = ["containerd"] }
scheduler = { version = "0.1.0", path = "../../operators/scheduler" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-std", "io-util", "macros", "rt", "signal", "sync"] }

[lints]
workspace = true

[dev-dependencies]
clustertest = { path = "../../clustertest" }
logs = { path = "../../observability/logs", features = ["test-util"] }
metrics = { path = "../../observability/metrics", features = ["test-util"] }
runtime = { path = "../../runtime", default-features = false, features = ["test-util"] }
tempfile = "=3.27.0"
time = "=0.3.53"
tokio = { version = "=1.52.3", features = ["macros", "rt", "time"] }
