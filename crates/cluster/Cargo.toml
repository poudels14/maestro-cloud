[package]
name = "cluster"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
etcd-client = { workspace = true, features = ["tls"] }
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
kernel-api = { version = "0.6.0", path = "../kernel/api" }
kernel-store = { version = "0.6.0", path = "../kernel/store" }
nix = { workspace = true, features = ["signal", "process"] }
rcgen = { workspace = true, features = ["pem", "x509-parser"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync", "time"] }
tonic = { workspace = true, default-features = false }
tracing.workspace = true
x25519-dalek = { workspace = true, features = ["getrandom", "static_secrets"] }
x509-parser = { workspace = true, features = ["verify"] }
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing-subscriber.workspace = true
