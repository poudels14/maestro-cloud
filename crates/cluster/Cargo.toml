[package]
name = "cluster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
hex = "=0.4.3"
hkdf = "=0.12.4"
hmac = "=0.12.1"
kernel-api = { version = "0.1.0", path = "../kernel/api" }
kernel-store = { version = "0.1.0", path = "../kernel/store" }
rcgen = { version = "=0.14.8", features = ["pem", "x509-parser"] }
serde.workspace = true
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
thiserror.workspace = true
time = "=0.3.53"
x25519-dalek = { version = "=3.0.0", features = ["getrandom", "static_secrets"] }
x509-parser = { version = "=0.18.1", features = ["verify"] }
zeroize = "=1.9.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
