[package]
name = "maestro-runtime"
version = "3.0.0"
edition = "2024"

[dependencies]
containerd-client = "0.9.0"
hex = "0.4.3"
maestro-core = { version = "3.0.0", path = "../maestro-core" }
prost = "0.14"
prost-types = "0.14.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "fs", "time", "sync", "io-util", "rt", "macros", "net"] }
tokio-stream = "0.1.19"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[features]
fake = []
