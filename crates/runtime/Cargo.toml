[package]
name = "runtime"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bytes = { workspace = true, optional = true }
containerd = { workspace = true, optional = true }
docker = { workspace = true, optional = true }
futures-util.workspace = true
flate2 = { workspace = true, optional = true }
hex.workspace = true
ignore = { workspace = true, optional = true }
kernel-api = { version = "0.6.0", path = "../kernel/api" }
libc.workspace = true
prost.workspace = true
prost-types.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
supervisor = { version = "0.6.0", path = "../kernel/supervisor" }
tar = { workspace = true, optional = true }
tempfile.workspace = true
parking_lot = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = ["docker", "containerd"]
test-util = ["dep:parking_lot"]
docker = ["dep:bytes", "dep:docker", "dep:ignore", "dep:tar", "dep:tokio-util"]
containerd = ["dep:containerd", "dep:flate2", "dep:tar"]

[dev-dependencies]
parking_lot.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-route.workspace = true
nix = { workspace = true, features = ["sched"] }
rtnetlink.workspace = true
