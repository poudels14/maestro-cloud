[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "=0.1.89"
kernel-api = { version = "0.1.0", path = "../kernel/api" }
serde = { version = "=1.0.228", features = ["derive"] }
test-util = { version = "=1.0.151", package = "serde_json", optional = true }
thiserror = "=2.0.18"

[lints]
workspace = true

[features]
test-util = ["dep:test-util"]

[dev-dependencies]
test-util = { version = "=1.0.151", package = "serde_json" }
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
