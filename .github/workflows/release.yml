name: Release

on:
  pull_request:
    branches: ["release"]
  push:
    branches: ["release"]
    tags: ["v*"]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Rewrite quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Install UI dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Check repository structure
        shell: bash
        run: |
          nix develop --command bash -euo pipefail -c '
            git diff --check
            python3 scripts/check-source-layout.py
            python3 scripts/check-crate-boundaries.py
            actionlint
            shellcheck scripts/*.sh
          '

      - name: Check Rust
        shell: bash
        env:
          INSTA_UPDATE: "no"
        run: |
          nix develop --command bash -euo pipefail -c '
            cargo fmt --all -- --check
            cargo deny check
            cargo clippy \
              --workspace \
              --all-targets \
              --all-features \
              -- \
              -D warnings
            cargo nextest run \
              --workspace \
              --all-features
            cargo test \
              --doc \
              --workspace \
              --all-features
          '

      - name: Check UI and generated API
        shell: bash
        run: |
          nix develop --command bash -euo pipefail -c '
            pnpm exec oxfmt --check ui/apps/panel ui/packages
            pnpm -r test
            pnpm --dir ui typecheck
            pnpm --dir ui build
            pnpm check:api-drift
          '

      - name: Evaluate Nix checks
        run: nix flake check --no-build

      - name: Start pinned Docker daemon
        uses: docker/setup-docker-action@v5.3.0
        with:
          version: v29.6.2
          set-host: true

      - name: Run real Docker acceptance
        run: nix develop --command scripts/run-docker-acceptance.sh

      - name: Run real containerd acceptance
        run: nix develop --command scripts/run-containerd-acceptance.sh

      - name: Run one-node and three-node acceptance
        run: nix develop --command scripts/run-real-cluster-acceptance.sh

      - name: Rehearse encrypted three-member cutover
        run: nix develop --command scripts/run-cutover-acceptance.sh

      - name: Run MinIO SSE-KMS acceptance
        run: nix develop --command scripts/run-minio-acceptance.sh

  build:
    name: Static bundle (${{ matrix.system }})
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Validate release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix eval --raw .#rewrite-static.version)
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build static release bundle
        run: nix build .#rewrite-static-bundle --print-build-logs

      - name: Build daemon image bundle
        run: >-
          nix build .#rewrite-daemon-image-bundle
          --out-link result-daemon-image
          --print-build-logs

      - name: Check NixOS module
        run: >-
          nix build
          .#checks.${{ matrix.system }}.rewrite-module
          --no-link
          --print-build-logs

      - name: Verify standalone executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist unpacked
          cp -L result/* dist/
          cp -L result-daemon-image/* dist/
          (
            cd dist
            sha256sum --check -- *.sha256
          )
          archive=$(find dist -maxdepth 1 -type f \
            -name 'maestro-rewrite-*.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C unpacked
          bundle=$(find unpacked -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$bundle"
          "$bundle/bin/maestro" --help
          "$bundle/bin/maestro-daemon" --help
          "$bundle/bin/maestro-migrate" --help
          "$bundle/bin/maestro-migrate" verify --help
          version=$(nix eval --raw .#rewrite-static.version)
          test "$("$bundle/bin/maestro" --version)" = "maestro $version"
          test "$("$bundle/bin/maestro" daemon --version)" = "daemon $version"
          test "$("$bundle/bin/maestro-daemon" --version)" = "daemon $version"
          test "$("$bundle/bin/maestro-migrate" --version)" = "maestro-migrate $version"
          test -s "$bundle/share/doc/maestro/cutover.md"
          test -s "$bundle/share/doc/maestro/rehearsal-evidence.md"
          test -s "$bundle/share/doc/maestro/multi-node.md"
          test -s "$bundle/share/doc/maestro/nixos-rewrite.md"
          test -s "$bundle/share/doc/maestro/tailscale.md"
          test -s "$bundle/share/maestro-panel/index.html"
          image_count=0
          for image in dist/*.docker.tar.gz; do
            test -f "$image"
            gzip -dc "$image" | tar -tf - | grep -Fx manifest.json
            image_count=$((image_count + 1))
          done
          test "$image_count" = 1

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: maestro-rewrite-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [quality, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v7
        with:
          pattern: maestro-rewrite-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --generate-notes \
            --verify-tag
