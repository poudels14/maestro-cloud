[workspace]
members = ["controller", "crates/apps/cli", "crates/apps/daemon", "crates/apps/migrate", "crates/apps/server", "crates/cluster", "crates/clustertest", "crates/kernel/api", "crates/kernel/controller", "crates/kernel/store", "crates/kernel/supervisor", "crates/node/agent", "crates/node/fabric", "crates/observability/logql", "crates/observability/logs", "crates/observability/logstore", "crates/observability/metrics", "crates/operators/build", "crates/operators/deployment", "crates/operators/dns", "crates/operators/firewall", "crates/operators/ingress", "crates/operators/preview", "crates/operators/scheduler", "crates/operators/upgrade", "crates/operators/webhook", "crates/runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
async-trait = "=0.1.89"
aws-config = "=1.9.0"
aws-sdk-secretsmanager = { version = "=1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
bytes = "=1.12.1"
chrono = "=0.4.45"
clap = { version = "=4.6.1", features = ["derive"] }
flate2 = "=1.1.9"
futures-util = "=0.3.33"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.4.2"
ignore = "=0.4.28"
insta = "=1.48.0"
ipnet = "=2.12.0"
json5 = "=0.4.1"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["aws_lc_rs"] }
libc = "=0.2.186"
proptest = "=1.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_ignored = "=0.1.14"
serde_path_to_error = "=0.1.20"
serde_json = "=1.0.151"
semver = "=1.0.28"
sha2 = "=0.10.9"
shellexpand = "=3.1.2"
strip-ansi-escapes = "=0.2.1"
tar = "=0.4.46"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
tokio-util = { version = "=0.7.18", features = ["io", "io-util"] }
uuid = { version = "=1.23.5", features = ["v4"] }

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "warn"
panic = "deny"
unwrap_used = "deny"
