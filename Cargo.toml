[workspace]
members = ["controller", "crates/clustertest", "crates/kernel/api", "crates/kernel/store"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
async-trait = "=0.1.89"
serde = { version = "=1.0.228", features = ["derive"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "warn"
panic = "deny"
unwrap_used = "deny"
