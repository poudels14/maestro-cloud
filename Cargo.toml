[workspace]
members = ["controller", "crates/apps/daemon", "crates/cluster", "crates/clustertest", "crates/kernel/api", "crates/kernel/controller", "crates/kernel/store", "crates/kernel/supervisor", "crates/node/agent", "crates/node/fabric", "crates/observability/logs", "crates/observability/logstore", "crates/observability/metrics", "crates/operators/deployment", "crates/operators/dns", "crates/operators/firewall", "crates/operators/ingress", "crates/operators/scheduler", "crates/runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
async-trait = "=0.1.89"
chrono = "=0.4.45"
flate2 = "=1.1.9"
insta = "=1.48.0"
ipnet = "=2.12.0"
proptest = "=1.11.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
strip-ansi-escapes = "=0.2.1"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "warn"
panic = "deny"
unwrap_used = "deny"
